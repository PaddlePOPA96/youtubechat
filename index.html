<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamChat Desktop</title>
    <link rel="icon" type="image/webp" href="/icon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body style="margin: 0; background-color: #f8fafd;">
    <div id="root">
      <!-- Instant Native Preloader Fallback (replaced seamlessly when React mounts) -->
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafd; font-family: 'Plus Jakarta Sans', sans-serif;">
        <div style="width: 88px; height: 88px; border-radius: 24px; background: #ffffff; border: 1px solid rgba(0, 133, 238, 0.25); box-shadow: 0 16px 36px -10px rgba(0, 133, 238, 0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
          <img src="/icon.webp" onerror="this.src='/icon.png'" alt="StreamChat" style="width: 68px; height: 68px; object-fit: contain;" />
        </div>
        <h1 style="font-size: 28px; font-weight: 800; color: #0f172a; margin: 0; letter-spacing: -0.03em;">
          Stream<span style="color: #0085ee;">Chat</span>
        </h1>
        <p style="font-size: 12px; color: #64748b; margin-top: 6px;">Memulai aplikasi...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
